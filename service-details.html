<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>NCRI 서비스 상세</title>
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="assets/vendor/aos/aos.css" rel="stylesheet" />
    <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet" />
    <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet" />
    <link href="assets/css/main.css" rel="stylesheet" />
  </head>
  <body class="inner-page">
    <header id="header" class="header d-flex align-items-center fixed-top">
      <div class="container-fluid container-xl position-relative d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo d-flex align-items-center">
          <h1 class="sitename">NCRI</h1>
        </a>
        <nav id="navmenu" class="navmenu">
          <ul>
            <li><a href="index.html#services">주요사업</a></li>
            <li><a href="index.html#pricing">교육/세미나</a></li>
            <li><a href="index.html#contact">문의</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main" style="margin-top: 80px">
      <section class="section">
        <div class="container" id="service-container">
          <!-- JS will inject content here -->
        </div>
      </section>
    </main>

    <footer id="footer" class="footer dark-background">
      <div class="container text-center py-4">
        <a href="index.html#services" class="btn btn-outline-light"><i class="bi bi-arrow-left"></i> 목록으로</a>
      </div>
    </footer>

    <script>
      const SERVICES = {
        'research': {
          title: '연구사업 및 자료발간',
          icon: 'bi-search',
          summary: 'NCS 기반 연구 수행과 전문자료 발간으로 정책 수립을 지원합니다.',
          bullets: [
            'NCS 개발/고도화 연구',
            '산업·직무 트렌드 리포트',
            '정책 제안 백서 발간',
            '공공 데이터 분석'
          ]
        },
        'certification': {
          title: '인증 및 평가',
          icon: 'bi-award',
          summary: '능력중심 인증·평가 체계를 구축·운영합니다.',
          bullets: [
            '과정평가형 자격 운영 지원',
            '능력단위별 평가도구 개발',
            '품질보증 및 사후관리',
            '평가자 양성 교육'
          ]
        },
        'lifelong-education': {
          title: '평생교육시설 운영',
          icon: 'bi-mortarboard',
          summary: 'NCS 기반 평생학습 서비스를 제공합니다.',
          bullets: [
            '직무역량 표준 기반 과정 운영',
            '온라인/오프라인 혼합 교육',
            '수료·이수 관리',
            '학습자 지원센터 운영'
          ]
        },
        'shared-facility': {
          title: '공동이용시설 설치 및 운영',
          icon: 'bi-building',
          summary: '공동학습 인프라를 구축·운영합니다.',
          bullets: [
            '실습실/스튜디오 구축',
            '장비 도입 및 유지보수',
            '시설 예약/안전 관리',
            '지역 협력네트워크 운영'
          ]
        },
        'consulting': {
          title: '경영 및 교육 컨설팅',
          icon: 'bi-diagram-3',
          summary: '조직 역량 강화를 위한 맞춤 컨설팅을 제공합니다.',
          bullets: [
            '직무분석·역량모델 설계',
            'NCS 기반 인사·평가체계',
            '교육체계(체계도/커리큘럼) 수립',
            '성과지표(KPI) 연계'
          ]
        },
        'events': {
          title: '교육, 세미나 및 학술대회',
          icon: 'bi-calendar-event',
          summary: '지식 공유와 네트워킹을 위한 행사를 운영합니다.',
          bullets: [
            '정기 공개세미나',
            '기업 맞춤 워크숍',
            '학술대회 기획/운영',
            '온라인 생중계/다시보기'
          ]
        },
        'outsourcing': {
          title: '위수 용역 수탁사업',
          icon: 'bi-briefcase',
          summary: '전문 용역을 안정적으로 수행합니다.',
          bullets: [
            '정부·지자체 용역 수행',
            '성과관리 및 보고',
            '대외 커뮤니케이션',
            '프로젝트 PMO'
          ]
        },
        'policy': {
          title: '권익보호 정책 제안',
          icon: 'bi-shield-check',
          summary: '공정하고 투명한 제도 운영을 위한 정책을 제안합니다.',
          bullets: [
            '이용자 권익보호 가이드',
            '개선안 연구 및 공청회',
            '법/제도 개선 제언',
            '이해관계자 협의체 운영'
          ]
        },
        'business': {
          title: '수익사업',
          icon: 'bi-graph-up',
          summary: '지속가능한 운영 기반을 마련합니다.',
          bullets: [
            '온라인 교육 구독',
            '프리미엄 컨설팅',
            '전문 인증서 발급',
            '연구자료 유료 구독'
          ]
        }
      };

      function getId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id') || 'research';
      }

      function render() {
        const id = getId();
        const data = SERVICES[id];
        const container = document.getElementById('service-container');
        if (!data) {
          container.innerHTML = `<div class="text-center py-5"><h2>서비스를 찾을 수 없습니다</h2><p class="text-muted">잘못된 주소이거나 종료된 서비스입니다.</p><a href="index.html#services" class="btn btn-primary mt-3">목록으로</a></div>`;
          return;
        }

        container.innerHTML = `
          <div class="row align-items-start g-5">
            <div class="col-lg-8">
              <div class="mb-4">
                <span class="subtitle">NCRI 주요사업</span>
                <h2 class="mb-2"><i class="bi ${data.icon}"></i> ${data.title}</h2>
                <p class="lead">${data.summary}</p>
              </div>

              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">주요 제공 내용</h5>
                  <ul class="mb-0">
                    ${data.bullets.map((b) => `<li>${b}</li>`).join('')}
                  </ul>
                </div>
              </div>

              <div class="alert alert-info mt-4" role="alert">
                보다 자세한 안내와 맞춤 상담이 필요하시면 아래 버튼을 눌러 문의해주세요.
              </div>

              <a href="index.html#contact" class="btn btn-primary btn-lg">문의하기</a>
            </div>
            <div class="col-lg-4">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">빠른 이동</h5>
                  <div class="d-grid gap-2">
                    <a class="btn btn-outline-secondary" href="index.html#services">주요사업 목록</a>
                    <a class="btn btn-outline-secondary" href="index.html#courses">강의 목록</a>
                    <a class="btn btn-outline-secondary" href="index.html#pricing">교육/세미나</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      render();
    </script>

    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/vendor/aos/aos.js"></script>
    <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
    <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  </body>
  </html>
